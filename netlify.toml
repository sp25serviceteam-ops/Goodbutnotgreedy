[build]
  publish = "."

# HQ lives on the portal site (it needs Supabase and the operator login, which
# this static site has no access to). This just makes the URL Lukas remembers
# work: cafecarepackage.com/hq -> the real page.
[[redirects]]
  from = "/hq"
  to = "https://orders.cafecarepackage.com/hq.html"
  status = 302
  force = true

# A cafe's own way in. Their roaster's ordering portal links here from the
# Rescue bags tab, and that cafe is not a roaster: /login and /signin below go
# to the wholesale dashboard, and the bare domain now goes straight to the
# wholesale pitch. /rescue is the cafe door.
[[redirects]]
  from = "/rescue"
  to = "/?signin=cafe"
  status = 302
  force = true

# The free cafe tools front page. The bare domain belongs to wholesale now, so
# the tools get their own address. Rewrite (200) keeps the URL clean; index.html
# reads ?cafe=1 and opens the tools landing instead of bouncing to /wholesale/.
[[redirects]]
  from = "/cafe"
  to = "/?cafe=1"
  status = 200

# The repo readme is not a page. Without this, Netlify serves it raw at
# /README.md because the publish dir is the repo root.
[[redirects]]
  from = "/README.md"
  to = "/wholesale/"
  status = 301
  force = true

# Roasters sign in on the platform, not here. These are the addresses a roaster
# would guess after losing the link we emailed them.
[[redirects]]
  from = "/login"
  to = "https://orders.cafecarepackage.com/admin.html"
  status = 302
  force = true

[[redirects]]
  from = "/signin"
  to = "https://orders.cafecarepackage.com/admin.html"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard"
  to = "https://orders.cafecarepackage.com/admin.html"
  status = 302
  force = true

# Setup links we email out: cafecarepackage.com/i/CODE works as well as the
# orders host, since that is the domain roasters actually know.
[[redirects]]
  from = "/i/:code"
  to = "https://orders.cafecarepackage.com/i/:code"
  status = 302
  force = true

# The pitch page moved from /wholesale/compare/ to /wholesale/ itself; the
# waitlist page it used to sit behind is gone. Old links (decks, emails, the
# "see how we stack up" link that used to be on the waitlist page) still land.
[[redirects]]
  from = "/wholesale/compare/*"
  to = "/wholesale/"
  status = 301
  force = true
