<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Care Pack tab mark: the green e from the carepack wordmark, knocked out of
       a solid tile. Green #00A04D is sampled from the wordmark itself.
       Drawn as shapes, not <text>, so it does not depend on a font being
       installed on the viewer's machine. Solid tile because a white one
       disappears into Chrome's light tab strip.
       Same file is served on orders.cafecarepackage.com, keep the two in step. -->
  <defs><clipPath id="cpTile"><rect width="32" height="32" rx="7"/></clipPath></defs>
  <!-- Everything is clipped to the tile, so the aperture wedge below can run
       past 32 without squaring off the rounded corner it crosses. -->
  <g clip-path="url(#cpTile)">
    <rect width="32" height="32" fill="#00A04D"/>
    <circle cx="16" cy="16" r="9" fill="none" stroke="#FFFFFF" stroke-width="5.2"/>
    <rect x="7" y="13.4" width="18" height="5.2" fill="#FFFFFF"/>
    <polygon points="16,18.6 34,18.6 34,34 26,34" fill="#00A04D"/>
  </g>
</svg>
